<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte — [NOM DU SITE]</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="header"></div>

  <main class="auth">
    <div class="auth-card">
      <h1>Créer un compte</h1>
      <p class="sub">[Ex : Ta première retouche est offerte.]</p>
      <form onsubmit="handleSignup(event)">
        <div class="field"><label for="name">Prénom</label><input id="name" type="text" required placeholder="Ton prénom"></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" required placeholder="ton@email.fr"></div>
        <div class="field"><label for="password">Mot de passe</label><input id="password" type="password" required minlength="8" placeholder="8 caractères minimum"></div>
        <label class="check">
          <input type="checkbox" required>
          <span>J'accepte les <a href="cgv.html">CGU / CGV</a> et la <a href="confidentialite.html">politique de confidentialité</a>.</span>
        </label>
        <button class="btn btn-primary btn-block" type="submit">Créer mon compte</button>
      </form>
      <div class="divider">OU</div>
      <button class="btn btn-ghost btn-block" type="button" onclick="loginWithGoogle()">Continuer avec Google</button>
      <p id="auth-msg" style="margin-top:14px;font-size:14px;text-align:center"></p>
      <p class="auth-foot">Déjà un compte ? <a href="connexion.html">Se connecter</a></p>
    </div>
  </main>

  <script src="assets/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
